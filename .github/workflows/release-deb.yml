name: Build .deb package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y gimp
          sudo apt-get install -y \
            checkinstall meson ninja-build \
            libgtk-3-dev libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libharfbuzz-dev libfontconfig-dev \
            libfreetype-dev liblcms2-dev libmypaint-dev mypaint-brushes \
            librsvg2-dev libgexiv2-dev libjson-glib-dev libappstream-dev \
            libpoppler-glib-dev libheif-dev libjxl-dev libwebp-dev \
            libtiff-dev libjpeg-dev libpng-dev libopenexr-dev \
            libopenjp2-7-dev libwmf-dev libarchive-dev libexiv2-dev \
            libbz2-dev liblzma-dev libxmu-dev libxpm-dev \
            gobject-introspection libgirepository1.0-dev \
            gettext xsltproc appstream \
            python3-gi

      - name: Clone sources
        run: |
          git clone --depth 1 --branch BABL_0_1_122 https://gitlab.gnome.org/GNOME/babl.git
          git clone --depth 1 --branch GEGL_0_4_66 https://gitlab.gnome.org/GNOME/gegl.git
          git clone --depth 1 --branch GIMP_3_0_8 https://gitlab.gnome.org/GNOME/gimp.git

      - name: Build babl
        run: |
          meson setup babl/_build babl --prefix=/usr -Dwith-docs=false
          ninja -C babl/_build
          sudo ninja -C babl/_build install
          sudo DESTDIR=/tmp/staging ninja -C babl/_build install

      - name: Build GEGL
        run: |
          meson setup gegl/_build gegl --prefix=/usr -Ddocs=false
          ninja -C gegl/_build
          sudo ninja -C gegl/_build install
          sudo DESTDIR=/tmp/staging ninja -C gegl/_build install

      - name: Build GIMP
        run: |
          meson setup gimp/_build gimp --prefix=/usr \
            -Dwebkit-unmaintained=false \
            -Dg-ir-doc=false
          ninja -C gimp/_build
          sudo DESTDIR=/tmp/staging ninja -C gimp/_build install

      - name: Determine version
        id: version
        run: |
          base=$(meson introspect gimp/_build --projectinfo \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          rev=${{ github.run_number }}
          echo "version=${base}-${rev}netlinux1" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-${rev}netlinux1" >> "$GITHUB_OUTPUT"

      - name: Package with checkinstall
        run: |
          sudo checkinstall --default \
            --pkgname=gimp \
            --pkgversion="${{ steps.version.outputs.version }}" \
            --maintainer="graham@netlinux.co.uk" \
            --requires="libgtk-3-0t64,libcairo2,libpango-1.0-0,libgdk-pixbuf-2.0-0,\
          liblcms2-2,libmypaint-1.5-1,mypaint-brushes,librsvg2-2,libgexiv2-2,\
          libjson-glib-1.0-0,libpoppler-glib8t64,libheif1,libjxl0.7,libwebp7,\
          libtiff6,libjpeg8,libpng16-16t64,libopenexr-3-1-30,libopenjp2-7,\
          libwmf-0.2-7,libarchive13,libexiv2-27,shared-mime-info,iso-codes" \
            --pakdir=. \
            --install=no \
            --fstrans=no \
            bash -c 'cp -a /tmp/staging/usr/* /usr/'

      - name: Repack .deb for reprepro compatibility
        run: |
          DEB=$(ls gimp_*.deb)
          sudo chmod 666 "$DEB"
          mkdir repack && cd repack
          ar x "../$DEB"
          for f in *.zst; do
            [ -f "$f" ] || continue
            zstd -d "$f"
            xz "${f%.zst}"
            rm "$f"
          done
          rm "../$DEB"
          ar rcs "../$DEB" debian-binary control.tar.xz data.tar.xz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: gimp ${{ steps.version.outputs.version }}
          body: |
            Automated build from commit ${{ github.sha }}

            GIMP 3.0 with bundled babl 0.1.122 and GEGL 0.4.66.

            Install: `sudo dpkg -i gimp_*.deb`
          files: gimp_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify package repository
        run: |
          sleep 5
          SIGNATURE=$(echo -n '{"repo":"netlinux-ai/gimp","tag":"${{ steps.version.outputs.tag }}"}' \
            | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" -binary \
            | xxd -p -c 256)
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=${SIGNATURE}" \
            -d '{"repo":"netlinux-ai/gimp","tag":"${{ steps.version.outputs.tag }}"}' \
            https://packages.netlinux.co.uk/webhook/update-repo
